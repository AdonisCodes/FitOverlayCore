name: CLOC

on:
  push:
    branches: ["*"]

jobs:
  cloc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count Lines of Code
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q cloc
          cloc --exclude-dir=.build,.swiftpm,node_modules,DerivedData .
