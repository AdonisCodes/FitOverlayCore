name: Run `FitOverlayKit` Tests

on:
  pull_request:
    paths:
      - "FitOverlayKit/**/*.swift"
      - "FitOverlayKit/Package.swift"
      - ".github/workflows/fitoverlay-kit-testing.yml"

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.2"

      - uses: actions/cache@v4
        with:
          path: FitOverlayKit/.build
          key: ${{ runner.os }}-fitoverlaykit-${{ hashFiles('FitOverlayKit/Package.swift') }}
          restore-keys: ${{ runner.os }}-fitoverlaykit-

      - name: Run Tests (Linux)
        working-directory: FitOverlayKit
        run: swift test

  macos-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run Tests (macOS)
        working-directory: FitOverlayKit
        run: swift test
