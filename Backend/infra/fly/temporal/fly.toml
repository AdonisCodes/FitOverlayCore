app = 'fitoverlay-backend-temporal-__FLY_ENVIRONMENT__'
primary_region = 'jnb'

[processes]
app = '/etc/temporal/entrypoint.sh autosetup'
ui = '/etc/temporal/start-ui.sh'

[env]
LOG_LEVEL = 'debug'

[[services]]
protocol = 'tcp'
internal_port = 7233
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[services.ports]]
port = 7233
# handlers = ['http'] # Do not expose to public, public ipv4/6 should be removed already
# alpn h2 is needed for the grpc protocol
[services.ports.tls_options]
alpn = ['h2']

[[services.tcp_checks]]
interval = '10s'
timeout = '2s'
grace_period = '5s'

[[services]]
protocol = 'tcp'
internal_port = 8080
min_machines_running = 0
processes = ['ui']

# Ideally, don't expose the UI to the public, keep it behind a CDN (eg Cloudflare) and whitelist the IP
# or make it public but set up SSO
[[services.ports]]
port = 8080
# handlers = ['http']

# [[services.ports]]
#   port = 443
#   handlers = ['tls', 'http']

[[vm]]
size = 'shared-cpu-1x'
memory = "1gb"
