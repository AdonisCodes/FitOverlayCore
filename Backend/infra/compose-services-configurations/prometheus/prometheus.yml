global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      scheme: http
      timeout: 10s
      api_version: v2

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "api-dev"
    static_configs:
      - targets: ["api-dev:6834"]
  - job_name: "worker-dev"
    static_configs:
      - targets: ["worker-dev:6835"]
