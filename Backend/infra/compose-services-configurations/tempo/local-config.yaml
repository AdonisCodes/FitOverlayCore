server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1000000
  max_block_duration: 5m
  partition_ring:
    kvstore:
      store: inmemory
    min_partition_owners_count: 1

live_store:
  partition_ring:
    kvstore:
      store: inmemory
    min_partition_owners_count: 1

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

querier: {}

query_frontend:
  search:
    duration_slo: 5s
