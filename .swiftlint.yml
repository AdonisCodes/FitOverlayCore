included:
  - Backend
  - FitOverlayKit
  - App

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "**/Package.swift"
  - App/FitOverlayUIKit/Sources/FitOverlayUIKit/Core/Generated

line_length:
  warning: 120
  error: 160

identifier_name:
  min_length: 2
  max_length: 60

type_body_length:
  warning: 400

file_length:
  warning: 600

disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - empty_count
  - force_unwrapping
  - sorted_imports
